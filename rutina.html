<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rutina de Luisa</title>
<style>
  :root{
    --bg:#f6f4f0;
    --card:#ffffff;
    --text:#2b2924;
    --muted:#726b60;
    --border:#e7e1d7;
    --chip:#f0ece3;
    --brazo:#c9743a;
    --pierna1:#2f8f5b;
    --pierna2:#1f6e46;
    --abs:#2f6fa8;
    --torso:#7a4fa0;
    --link:#2f6fa8;
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17150f;
      --card:#211e17;
      --text:#f2ede2;
      --muted:#b4ab9c;
      --border:#3a3527;
      --chip:#2b2720;
      --link:#7fb2e0;
      --shadow: 0 1px 3px rgba(0,0,0,0.4);
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:60px;
  }
  header{
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:10;
    padding:16px 16px 0 16px;
    border-bottom:1px solid var(--border);
  }
  h1{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:1.3rem;
    margin:0 0 12px 0;
  }
  h1 svg{
    width:24px;
    height:24px;
    flex:0 0 auto;
    color:var(--text);
  }
  .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:12px;
    -webkit-overflow-scrolling:touch;
  }
  .tab{
    flex:0 0 auto;
    padding:8px 16px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-size:0.9rem;
    cursor:pointer;
    white-space:nowrap;
  }
  .tab.active{
    background:var(--text);
    color:var(--bg);
    border-color:var(--text);
  }
  main{
    padding:16px;
    max-width:640px;
    margin:0 auto;
  }
  .week-actions{
    display:flex;
    justify-content:flex-end;
    margin-bottom:12px;
  }
  .btn-ghost{
    background:none;
    border:1px solid var(--border);
    color:var(--muted);
    padding:6px 12px;
    border-radius:8px;
    font-size:0.8rem;
    cursor:pointer;
  }
  .day-card{
    background:var(--card);
    border:1px solid var(--border);
    border-left:5px solid var(--accent, #999);
    border-radius:12px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .day-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    cursor:pointer;
  }
  .day-head-left{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .day-name{
    font-weight:700;
    font-size:1rem;
  }
  .day-focus{
    font-size:0.82rem;
    color:var(--muted);
  }
  .day-progress{
    font-size:0.8rem;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .chevron{
    width:14px;
    height:14px;
    flex:0 0 auto;
    color:var(--muted);
    transition:transform 0.15s ease;
  }
  .day-card.open .chevron{
    transform:rotate(90deg);
  }
  .day-body{
    display:none;
    padding:0 16px 14px 16px;
  }
  .day-card.open .day-body{
    display:block;
  }
  .warmup{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:0.85rem;
    color:var(--muted);
    background:var(--chip);
    padding:8px 10px;
    border-radius:8px;
    margin-bottom:10px;
  }
  .warmup svg{
    width:16px;
    height:16px;
    flex:0 0 auto;
  }
  .circuit{
    margin-bottom:12px;
  }
  .circuit-title{
    font-size:0.78rem;
    text-transform:uppercase;
    letter-spacing:0.03em;
    color:var(--muted);
    margin-bottom:6px;
  }
  .exercise{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid var(--border);
  }
  .exercise:last-child{
    border-bottom:none;
  }
  .exercise input[type=checkbox]{
    width:20px;
    height:20px;
    flex:0 0 auto;
    margin-top:2px;
    accent-color:var(--accent, #333);
  }
  .exercise-text{
    flex:1;
    min-width:0;
  }
  .exercise-name-row{
    display:flex;
    align-items:baseline;
    gap:8px;
    flex-wrap:wrap;
  }
  .exercise-name{
    font-size:0.92rem;
    line-height:1.3;
  }
  .exercise-name.done{
    text-decoration:line-through;
    color:var(--muted);
  }
  .exercise-sets{
    font-size:0.78rem;
    color:var(--muted);
    margin-top:1px;
  }
  .guide-link{
    display:inline-flex;
    align-items:center;
    gap:3px;
    font-size:0.72rem;
    color:var(--link);
    text-decoration:none;
    border:1px solid var(--border);
    border-radius:999px;
    padding:2px 8px 2px 6px;
    white-space:nowrap;
  }
  .guide-link svg{
    width:11px;
    height:11px;
    flex:0 0 auto;
  }
  .progress-bar-outer{
    width:52px;
    height:6px;
    background:var(--border);
    border-radius:999px;
    overflow:hidden;
  }
  .progress-bar-inner{
    height:100%;
    background:var(--accent,#333);
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:0.75rem;
    padding:16px;
  }
</style>
</head>

            ]),
            circuit("Circuito 2 · x3", [
              ex("Máquina del culito", "x15", "hip-thrust"),
              ex("Extensión", "x20", "leg-extension"),
              ex("Aductor de cerrar", "x20", "hip-adduction-machine")
            ]),
            circuit("Circuito 3 · x3", [
              ex("Hack al revés", "x20", "hack-squat"),
              ex("Aductor al revés", "x30", "hip-abduction-machine")
            ])
          ]
        },
        {
          key: "s4-miercoles", day: "Miércoles", focus: "Abs y Cardio", type: "abs",
          warmup: "Trote suave y movilidad articular",
          circuits: [
            circuit("Circuito 1 · x4", [
              ex("Burpies", "x15", "burpee"),
              ex("Mariposas", "x40", "jumping-jack"),
              ex("Remo en máquina (cardio)", "40 seg", "rowing")
            ]),
            circuit("Circuito 2 · x3", [
              ex("Plancha tocando hombro", "x15", "plank-shoulder-tap"),
              ex("Plancha haciendo skippi", "x15", "mountain-climber"),
              ex("Trotar hasta el hospital", "", "running")
            ]),
            circuit("Circuito 3 · x4", [
              ex("Acostada, tijera", "1 min", "flutter-kick"),
              ex("Acostada, elevaciones", "1 min", "lying-leg-raise"),
              ex("Bicicleta", "x20", "bicycle-crunch"),
              ex("Abdominales", "x20", "crunch")
            ])
          ]
        },
        {
          key: "s4-jueves", day: "Jueves", focus: "Torso", type: "torso",
          circuits: [
            circuit("Circuito 1 · x3", [
              ex("Jalón al pecho", "x15", "lat-pulldown"),
              ex("Remo", "x15", "seated-row"),
              ex("Polea, agarre 2 cuerdas al pecho", "x15", "seated-row")
            ]),
            circuit("Circuito 2 · x3", [
              ex("Jalón de espalda por encima de la cabeza", "x20", "wide-grip-lat-pulldown"),
              ex("Banco, brazos arriba con mancuerna hacia atrás", "x20"),
              ex("Cajón, sostenerse de espaldas, bajar y subir", "x20", "bench-dip")
            ]),
            circuit("Circuito 3 · x3", [
              ex("Encogimiento de hombros con barra", "x20", "shrug"),
              ex("Extensión de espalda (hiperextensión)", "x15", "back-extension")
            ])
          ]
        },
        {
          key: "s4-viernes", day: "Viernes", focus: "Pierna B", type: "pierna2",
          circuits: [
            circuit("Circuito 1 · x3", [
              ex("Sentadilla búlgara", "x10 por pierna", "bulgarian-split-squat"),
              ex("Zancada con peso", "x20", "walking-lunge"),
              ex("Step-down (bajada controlada del cajón)", "x12 por pierna", "step-down")
            ]),
            circuit("Circuito 2 · x3", [
              ex("Puente", "x15", "glute-bridge"),
              ex("Patada", "15 por pierna", "donkey-kick"),
              ex("La que llega al culito", "x20", "machine-glute-kickback")
            ]),
            circuit("Circuito 3 · x3", [
              ex("Cajón, subir y bajar", "x20", "step-up"),
              ex("Avanzadas con peso (incluye sentadilla)", "x20", "walking-lunge")
            ])
          ]
        }
      ]
    }
  ];

  // ---- storage (best-effort; iOS Safari may clear it, that's fine) ----
  var STORAGE_KEY = "rutinaLuisaProgress";
  var state = {};
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = JSON.parse(raw);
  } catch(e) { state = {}; }

  function saveState(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  }

  function exId(dayKey, ci, ei){ return dayKey + "-c" + ci + "-e" + ei; }

  // ---- rendering ----
  var weekTabs = document.getElementById("weekTabs");
  var daysContainer = document.getElementById("daysContainer");
  var resetWeekBtn = document.getElementById("resetWeekBtn");
  var activeWeek = 0;

  function countProgress(day){
    var total = 0, done = 0;
    day.circuits.forEach(function(c, ci){
      c.exercises.forEach(function(ex, ei){
        total++;
        if (state[exId(day.key, ci, ei)]) done++;
      });
    });
    return { total: total, done: done };
  }

  function renderTabs(){
    weekTabs.innerHTML = "";
    weeks.forEach(function(w, i){
      var btn = document.createElement("button");
      btn.className = "tab" + (i === activeWeek ? " active" : "");
      btn.textContent = w.name;
      btn.addEventListener("click", function(){
        activeWeek = i;
        renderTabs();
        renderDays();
      });
      weekTabs.appendChild(btn);
    });
  }

  function renderDays(){
    daysContainer.innerHTML = "";
    var week = weeks[activeWeek];
    week.days.forEach(function(day, idx){
      var card = document.createElement("div");
      card.className = "day-card";
      card.style.setProperty("--accent", TYPE_COLORS[day.type] || "#999");
      if (idx === 0) card.classList.add("open");

      var head = document.createElement("div");
      head.className = "day-head";

      var left = document.createElement("div");
      left.className = "day-head-left";
      var name = document.createElement("div");
      name.className = "day-name";
      name.textContent = day.day;
      var focus = document.createElement("div");
      focus.className = "day-focus";
      focus.textContent = day.focus;
      left.appendChild(name);
      left.appendChild(focus);

      var right = document.createElement("div");
      right.className = "day-progress";
      var progLabel = document.createElement("span");
      var progOuter = document.createElement("div");
      progOuter.className = "progress-bar-outer";
      var progInner = document.createElement("div");
      progInner.className = "progress-bar-inner";
      progOuter.appendChild(progInner);
      var chevron = document.createElement("span");
      chevron.className = "chevron";
      chevron.innerHTML = CHEVRON_SVG;
      right.appendChild(progLabel);
      right.appendChild(progOuter);
      right.appendChild(chevron);

      head.appendChild(left);
      head.appendChild(right);

      var body = document.createElement("div");
      body.className = "day-body";

      if (day.warmup){
        var warm = document.createElement("div");
        warm.className = "warmup";
        warm.innerHTML = WARMUP_SVG + "<span>" + day.warmup + "</span>";
        body.appendChild(warm);
      }

      day.circuits.forEach(function(c, ci){
        var cWrap = document.createElement("div");
        cWrap.className = "circuit";
        var cTitle = document.createElement("div");
        cTitle.className = "circuit-title";
        cTitle.textContent = c.label;
        cWrap.appendChild(cTitle);

        c.exercises.forEach(function(exItem, ei){
          var id = exId(day.key, ci, ei);
          var row = document.createElement("div");
          row.className = "exercise";

          var cbLabel = document.createElement("label");
          cbLabel.style.display = "contents";

          var cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = !!state[id];
          cb.addEventListener("change", function(){
            state[id] = cb.checked;
            saveState();
            nameEl.classList.toggle("done", cb.checked);
            updateHeaderProgress();
          });

          var textWrap = document.createElement("div");
          textWrap.className = "exercise-text";

          var nameRow = document.createElement("div");
          nameRow.className = "exercise-name-row";
          var nameEl = document.createElement("span");
          nameEl.className = "exercise-name" + (state[id] ? " done" : "");
          nameEl.textContent = exItem.name;
          nameRow.appendChild(nameEl);

          if (exItem.slug){
            var guideLink = document.createElement("a");
            guideLink.className = "guide-link";
            guideLink.href = GUIDE_BASE + exItem.slug + "/";
            guideLink.target = "_blank";
            guideLink.rel = "noopener noreferrer";
            guideLink.innerHTML = LINK_SVG + "<span>Ver ejercicio</span>";
            guideLink.addEventListener("click", function(evt){ evt.stopPropagation(); });
            nameRow.appendChild(guideLink);
          }

          textWrap.appendChild(nameRow);

          if (exItem.sets){
            var setsEl = document.createElement("div");
            setsEl.className = "exercise-sets";
            setsEl.textContent = exItem.sets;
            textWrap.appendChild(setsEl);
          }

          cbLabel.appendChild(cb);
          cbLabel.appendChild(textWrap);
          row.appendChild(cbLabel);
          cWrap.appendChild(row);
        });

        body.appendChild(cWrap);
      });

      function updateHeaderProgress(){
        var p = countProgress(day);
        progLabel.textContent = p.done + "/" + p.total;
        var pct = p.total ? (p.done / p.total * 100) : 0;
        progInner.style.width = pct + "%";
      }
      updateHeaderProgress();

      head.addEventListener("click", function(){
        card.classList.toggle("open");
      });

      card.appendChild(head);
      card.appendChild(body);
      daysContainer.appendChild(card);
    });
  }

  resetWeekBtn.addEventListener("click", function(){
    var week = weeks[activeWeek];
    var ok = confirm("¿Reiniciar el progreso de " + week.name + "?");
    if (!ok) return;
    week.days.forEach(function(day){
      day.circuits.forEach(function(c, ci){
        c.exercises.forEach(function(ex, ei){
          delete state[exId(day.key, ci, ei)];
        });
      });
    });
    saveState();
    renderDays();
  });

  renderTabs();
  renderDays();
})();
</script>
</body>
</html>
